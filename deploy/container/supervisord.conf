; All five processes log to stdout/stderr so `kubectl logs` shows everything,
; prefixed by program name. Anything that dies is restarted; if Chrome or Xvfb
; keep dying, the gateway's /healthz goes unhealthy and the pod fails its probe.
[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
user=chrome
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_GEOMETRY)s -ac -nolisten tcp +extension RANDR +extension GLX
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
user=chrome
command=/usr/bin/fluxbox -log /dev/null
autorestart=true
priority=20
startsecs=2
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/chrome"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chrome]
user=chrome
command=/usr/local/bin/start-chrome
autorestart=true
priority=30
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=15
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/chrome"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
user=chrome
command=/usr/local/bin/start-vnc
autorestart=true
priority=40
startsecs=3
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/chrome"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
user=chrome
command=/usr/local/bin/browser-fetch
autorestart=true
priority=50
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
