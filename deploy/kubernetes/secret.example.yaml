# Copy to secret.yaml, fill in, and keep it out of git. Or create it directly:
#
#   kubectl -n browser-test create secret generic browser-fetch \
#     --from-literal=token=$(openssl rand -hex 24) \
#     --from-literal=driver-token=$(openssl rand -hex 24) \
#     --from-literal=reader-token=$(openssl rand -hex 24) \
#     --from-literal=admin-token=$(openssl rand -hex 24) \
#     --from-literal=vnc-password=$(openssl rand -base64 12 | tr -d /=+ | cut -c1-8)
#
# The VNC password is limited to 8 characters by the VNC protocol.
# driver-token may drive L1 sessions; reader-token is /fetch only. Both are
# optional: the root token grants everything.
#
# admin-token is the token for the HUMAN-ONLY macro admin band (approve/
# revoke/edit/delete). It must differ from every agent-facing token and must
# never appear in the agent's environment — only a human may approve.
apiVersion: v1
kind: Secret
metadata:
  name: browser-fetch
type: Opaque
stringData:
  token: replace-me-bearer-token
  driver-token: replace-me-driver-token
  reader-token: replace-me-reader-token
  admin-token: replace-me-admin-token-human-only
  vnc-password: replace8
